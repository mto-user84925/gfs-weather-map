name: "Déploiement Front Seul (GitHub Pages)"

on:
  workflow_dispatch:
    inputs:
      merge_run_ids:
        description: 'IDs de runs dont il faut fusionner les chunks (ex: 40074728688 40075389042)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/**'
      - 'config/**'
      - '.github/workflows/deploy_front.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-front:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: inputs.merge_run_ids != ''
        with:
          python-version: '3.11'

      - name: Dépendances Python (si fusion de chunks)
        if: inputs.merge_run_ids != ''
        run: pip install -r requirements.txt -q

      - name: Restaurer les données output du dernier run réussi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf .restore_tmp
          mkdir -p .restore_tmp
          RESTORED=""
          for RUN_ID in $(gh run list --repo mto-user84925/gfs-weather-map \
                --status success --limit 20 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Build & Deploy|Déploiement Front Seul")) | .databaseId' 2>/dev/null || true); do
            echo "Tentative de restauration depuis le run $RUN_ID..."
            if gh run download "$RUN_ID" --repo mto-user84925/gfs-weather-map \
                 -n github-pages -D .restore_tmp >/dev/null 2>&1; then
              if tar -xf .restore_tmp/artifact.tar ./output 2>/dev/null || \
                 tar -xf .restore_tmp/artifact.tar output 2>/dev/null; then
                RESTORED="$RUN_ID"
                break
              fi
              rm -rf .restore_tmp
              mkdir -p .restore_tmp
            fi
          done
          rm -rf .restore_tmp
          if [ -z "$RESTORED" ]; then
            echo "::error::Aucun artefact github-pages trouvé"
            exit 1
          fi
          echo "Base restaurée directement dans ./output depuis le run $RESTORED"

      - name: Fusion optionnelle de chunks de runs calculés
        if: inputs.merge_run_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for RID in ${{ inputs.merge_run_ids }}; do
            echo "Téléchargement des chunks du run $RID..."
            rm -rf .chunks_tmp
            mkdir -p .chunks_tmp
            gh run download "$RID" --repo mto-user84925/gfs-weather-map -p "chunk-*" -D .chunks_tmp
            if ls -d .chunks_tmp/chunk-afs-* >/dev/null 2>&1; then
              rm -rf output/aifs output/aifs_france
            fi
            if ls -d .chunks_tmp/chunk-ifs-* >/dev/null 2>&1; then
              rm -rf output/ifs output/ifs_france
            fi
            for cdir in .chunks_tmp/chunk-*/; do
              [ -d "$cdir" ] || continue
              cp -r "$cdir"* output/ 2>/dev/null || true
            done
            rm -rf .chunks_tmp
          done
          python -u pipeline/generate_fond_gfs.py --domain europe
          python -u pipeline/generate_fond_gfs.py --domain france
          python -u pipeline/assemble.py

      - name: Assemblage du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp extremes.html _site/ 2>/dev/null || true
          cp logo*.png _site/ 2>/dev/null || true
          cp cyclones_actifs.json _site/ 2>/dev/null || true
          cp output/cyclones_actifs.json _site/ 2>/dev/null || true
          cp alertes_extremes_monde.json _site/ 2>/dev/null || true
          cp output/alertes_extremes_monde.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/
          cp -r config _site/ 2>/dev/null || true
          mv output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
